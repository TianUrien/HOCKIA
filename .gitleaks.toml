# Gitleaks configuration for HOCKIA
# https://github.com/gitleaks/gitleaks

title = "HOCKIA Gitleaks Config"

[allowlist]
  description = "Known safe patterns"

  # CI uses placeholder values for build verification
  regexTarget = "match"
  regexes = [
    '''placeholder-key-for-build-verification''',
  ]

  # Paths that contain test fixtures, example configs, or generated types
  paths = [
    '''client/e2e/\.auth/''',
    '''client/e2e/\.data/''',
    '''client/src/types/supabase\.ts''',
    '''\.env\.example''',
    # Firebase client config shipped inside the Android app; its key is not a secret.
    '''client/android/app/google-services\.json''',
  ]

# Extend the built-in rule set; the sections above only add allowlist entries.
[extend]
useDefault = true
